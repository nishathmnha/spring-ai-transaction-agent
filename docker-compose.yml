services:
  postgres:
    image: postgres:16-alpine
    container_name: spring-ai-transaction-agent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banking_agent}
      POSTGRES_USER: ${POSTGRES_USER:-banking_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banking_agent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banking_agent} -d ${POSTGRES_DB:-banking_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
